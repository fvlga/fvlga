<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="gl" width="1080" height="608" style="display:none"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// Drop-out VFX ("alone"): slow push-in, swaying grass, shimmering river, breathing heart, drifting light leaks,
// letter-by-letter reveal of "alone", twinkling stars, fade in from white.
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D A, B; uniform float t, kick, bass, hit, mixAB, rot; uniform vec2 res;
const float AR = 1024.0 / 572.0;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
vec3 tex(vec2 q){ return texture(A, clamp(q, 0.001, 0.999)).rgb; }
void main(){
  // rot = shot progress 0..1 (drives the slow push-in and the "alone" reveal); mixAB = time since cut
  float ft = floor(t * 18.0);
  float z = 1.0 + 0.07 * rot + 0.006 * kick;
  vec2 q = (uv - vec2(0.5, 0.62)) / z + vec2(0.5, 0.62);                    // push in toward the figure
  q += vec2(n2(vec2(t * 3.0, 1.0)) - 0.5, n2(vec2(t * 3.0, 5.0)) - 0.5) * 0.004;   // gate weave
  // grass sways: below the far bank, horizontal wave growing toward the bottom
  float g = smoothstep(0.62, 1.0, q.y) * (1.0 - smoothstep(0.84, 0.92, q.y) * step(0.4, q.x) * step(q.x, 0.6));
  q.x += sin(q.y * 70.0 + t * 2.2 + sin(q.x * 9.0)) * 0.0025 * g;
  // river shimmer: bright, low-saturation water band
  vec3 b0 = tex(q);
  float water = smoothstep(0.52, 0.56, q.y) * (1.0 - smoothstep(0.73, 0.77, q.y)) * smoothstep(0.55, 0.7, dot(b0, vec3(0.33))) * step(0.08, q.x) * step(q.x, 0.72);
  q.x += sin(q.y * 260.0 + t * 4.0) * 0.0018 * water; q.y += sin(q.x * 120.0 - t * 3.0) * 0.0008 * water;
  vec3 col = tex(q);
  col += water * vec3(1.0, 0.95, 0.85) * pow(n2(vec2(q.x * 180.0, q.y * 600.0 - t * 2.0)), 8.0) * 1.6;       // glints
  // halation: soft glow from highlights
  vec3 hl = vec3(0.0); for (int i = 0; i < 10; i++) { float a = float(i) * 0.628; hl += max(tex(q + vec2(cos(a) / AR, sin(a)) * 0.02) - 0.78, 0.0); }
  col += hl / 10.0 * vec3(1.2, 0.6, 0.5);
  // the cracked heart breathes on the beat and glows
  vec2 hc = (q - vec2(0.5, 0.23)) * vec2(AR, 1.0);
  float hm = (1.0 - smoothstep(0.045, 0.06, length(hc)));
  vec3 hb = tex(q); float hl2 = smoothstep(0.06, 0.16, min(hb.r, min(hb.g, hb.b)) - dot(tex(q + vec2(0.012, 0.0)), vec3(0.33)) + 0.1);
  col = mix(col, vec3(1.0, 0.75, 0.9), hm * hl2 * (0.3 + 0.6 * kick));
  col += vec3(1.0, 0.45, 0.7) * exp(-dot(hc, hc) / 0.003) * (0.02 + 0.06 * kick);
  // drifting light leaks (pink + gold)
  vec2 l1 = vec2(0.85 + 0.1 * sin(t * 0.4), 0.3 + 0.2 * sin(t * 0.3));
  vec2 l2 = vec2(0.12 + 0.08 * sin(t * 0.5 + 1.0), 0.75 + 0.15 * cos(t * 0.35));
  col += vec3(1.0, 0.45, 0.7) * exp(-dot((uv - l1) * vec2(1.8, 1.0), (uv - l1) * vec2(1.8, 1.0)) / 0.06) * (0.25 + 0.1 * sin(t * 1.7));
  col += vec3(1.0, 0.7, 0.3) * exp(-dot((uv - l2) * vec2(1.8, 1.0), (uv - l2) * vec2(1.8, 1.0)) / 0.05) * (0.2 + 0.1 * sin(t * 1.3 + 2.0));
  // "alone" reveals letter by letter (left to right) with a soft wipe; hidden until the reveal reaches it
  float tm = step(0.83, q.y) * step(q.y, 0.93) * step(0.40, q.x) * step(q.x, 0.60);
  float rv = smoothstep(rot * 0.42 + 0.38, rot * 0.42 + 0.36, q.x);
  vec3 bgfill = tex(vec2(q.x, 0.8));
  col = mix(col, bgfill * 0.95 + hl / 10.0, tm * (1.0 - rv) * smoothstep(0.7, 0.95, dot(tex(q), vec3(0.33))));
  // twinkling sparkles in the sky
  for (int i = 0; i < 10; i++) {
    vec2 sp = vec2(0.05 + 0.9 * h(vec2(float(i), 1.0)), 0.05 + 0.35 * h(vec2(float(i), 2.0)));
    float tw = pow(max(0.0, sin(t * (1.5 + 2.0 * h(vec2(float(i), 5.0))) + float(i) * 2.1)), 8.0);
    vec2 dd = (q - sp) * vec2(AR, 1.0) * 90.0; float s = max(0.0, 1.0 - abs(dd.x) * 8.0 - abs(dd.y)) + max(0.0, 1.0 - abs(dd.y) * 8.0 - abs(dd.x));
    col += vec3(1.0, 0.95, 1.0) * s * tw;
  }
  // gentle film flicker, fade in from white at the cut, grain, vignette
  col *= 0.95 + 0.06 * h(vec2(ft, 9.0));
  col = mix(col, vec3(1.0, 0.95, 0.97), (1.0 - smoothstep(0.0, 0.5, mixAB)) * 0.8);
  col += (h(uv * res + fract(t * 13.1) * 91.0) - 0.5) * 0.09;
  col *= 1.0 - 0.3 * pow(length((uv - 0.5) * vec2(1.1, 1.6)), 2.4);
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
let gl, U = {}, AN, out, octx;
function init(analysis, ims) {
  AN = analysis; const cv = document.getElementById('gl'); gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
  const sh = (ty, s) => { const x = gl.createShader(ty); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ims.forEach((im, i) => { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); });
  for (const n of ['A', 'B', 't', 'kick', 'bass', 'hit', 'mixAB', 'rot', 'res']) U[n] = gl.getUniformLocation(prog, n);
  gl.uniform1i(U.A, 0); gl.uniform1i(U.B, 1); gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U.res, cv.width, cv.height);
  out = document.getElementById('out'); octx = out.getContext('2d');
}
function render(t) {
  const bp = 60 / AN.bpm, beat = Math.max(0, (t - AN.t0) / bp), ph = beat % 1, kick = Math.exp(-(ph * bp) * 9);
  const f = Math.min(AN.frames - 1, Math.max(0, Math.round(t * AN.fps))), bass = AN.bass[f];
  const hit = (Math.floor(beat) % 4 === 0 && ph < 0.12) ? 1 : 0;
  const T0 = 65.13, mixAB = Math.max(0, t - T0), rot = Math.min(1, Math.max(0, (t - T0) / 2.2));
  gl.uniform1f(U.t, t); gl.uniform1f(U.kick, kick); gl.uniform1f(U.bass, bass); gl.uniform1f(U.hit, hit); gl.uniform1f(U.mixAB, mixAB); gl.uniform1f(U.rot, rot);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  octx.fillStyle = '#000'; octx.fillRect(0, 0, out.width, out.height);
  const SH = 608, SY = Math.round((out.height - SH) / 2), z = 1 + 0.02 * kick;
  octx.save(); octx.translate(out.width / 2, SY + SH / 2); octx.scale(z, z); octx.drawImage(gl.canvas, -540, -SH / 2); octx.restore();
  octx.fillRect(0, 0, out.width, SY - 1); octx.fillRect(0, SY + SH + 1, out.width, out.height - SY - SH);
}
window.ready = false;
const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
Promise.all([fetch('../analysis.json').then(r => r.json()), load('drop.jpg'), load('drop.jpg')])
  .then(([a, i0, i1]) => { init(a, [i0, i1]); window.ready = true; }).catch(e => { window.err = String(e.stack || e); });
window.renderBatch = (t0, n, fps, q) => { const r = []; for (let i = 0; i < n; i++) { render(t0 + i / fps); r.push(out.toDataURL('image/jpeg', q).slice(23)); } return r; };
</script></body></html>
