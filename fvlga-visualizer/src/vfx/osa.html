<canvas id="c" width="1080" height="608"></canvas>
<script>

const PAGES = [
  ['Instructions', 'Leave before the song ends. Do not look back at the window. If somebody asks where you went, tell them the river, tell them anything. The light is only gold for a minute and then it is gone, and you will spend the rest of the summer trying to describe it.'],

const BADGE = ['side a', 'bands up', 'no flash', 'tape 03'];

const rng = s => () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
function bar(t) { return Math.floor(Math.max(0, (t - A.t0) / (60 / A.bpm)) / 4); }
function on(id, b, p) { return rng(b * 7919 + id * 104729 + 13)() < p; }               // does element `id` show in bar `b`?
function render(t) {
  ctx.clearRect(0, 0, W, H);
  const inDrop = t > 65.13 && t < 69.17;   // over the 'alone' breakdown only the caption shows
  if (t < 8.134 || t >= 102.6) return;
  const bp = 60 / A.bpm, beat = (t - A.t0) / bp, b = bar(t), kick = Math.exp(-((beat % 1) * bp) * 9);
  const f = Math.min(A.frames - 1, Math.round(t * A.fps)), bass = A.bass[f];
  // lyric caption: tiny lowercase cream sans, bottom centre
  const cap = CAPS.find(c => t >= c[0] && t < c[1]);
  if (cap) { ctx.font = '400 21px Cap'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; const cw = ctx.measureText(cap[2].toLowerCase()).width;
    const cy = inDrop ? H - 120 : H - 28;   // lift the caption off the 'alone' lettering during the breakdown
    ctx.fillStyle = 'rgba(8,14,18,.55)'; ctx.beginPath(); ctx.roundRect(W / 2 - cw / 2 - 12, cy - 22, cw + 24, 31, 6); ctx.fill();   // QA: readable on bright frames
    ctx.fillStyle = CREAM; ctx.fillText(cap[2].toLowerCase(), W / 2, cy); }
  if (inDrop) return;
  let boxX = null;   // where the quote box is this bar (so other elements keep clear of it)
  // book page: a different spot every time
  if (on(1, Math.floor(b / 2), 0.45)) { const k = Math.floor(b / 2), pg = PAGES[k % PAGES.length];
    // box origins (330x150): TL, TR (clear of the badge), ML, MR, BL, BR (clear of the caption + status list), top-centre
    const SL = [[20, 40], [W - 470, 40], [20, 230], [W - 350, 230], [20, H - 215], [W - 600, H - 215], [W / 2 - 165, 40]];
    const sl = SL[(k * 5 + 2) % SL.length], jr = rng(k * 977 + 5), x = sl[0] + 14 + Math.round((jr() - 0.5) * 24), _bx = (boxX = sl[0]), y = sl[1] + 30 + Math.round((jr() - 0.5) * 16);
    ctx.fillStyle = 'rgba(6,12,16,.42)'; ctx.fillRect(x - 14, y - 30, 330, 150);   // dark scrim behind the page
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.font = '22px BookB'; ctx.fillText(pg[0], x, y);
    ctx.font = '12.5px Book'; const words = pg[1].split(' '); let line = '', yy = y + 26;
    for (const w of words) { const tl = line + w + ' '; if (ctx.measureText(tl).width > 300) { ctx.fillText(line, x, yy); line = w + ' '; yy += 16; } else line = tl; } ctx.fillText(line, x, yy); }
  // micro-text in the top corners
  ctx.font = '400 10px Cap'; ctx.fillStyle = 'rgba(245,233,168,.85)';
  if (on(2, b, 0.6)) { ctx.textAlign = 'left'; ctx.fillText(MICRO[b % MICRO.length], 14, 18); }
  if (on(3, b, 0.5)) { ctx.textAlign = 'right'; ctx.fillText(MICRO[(b + 3) % MICRO.length], W - 14, 18); }
  // status list block
  if (on(4, b, 0.3)) { ctx.textAlign = 'left'; ctx.font = '500 11px Cap'; ctx.fillStyle = CREAM; const x = W - 190, y = H - 110;
    ctx.fillText('relationship status:', x, y); ctx.font = '400 11px Cap';
    ['[ ] cuffed', '[ ] dancing', '[x] outside', '[x] gone'].forEach((s, i) => ctx.fillText(s, x + 8, y + 16 + i * 14)); }
  // (v27: the volume-meter pills on the right are retired)
  // (v27: the red film strip is retired — artist didn't want it in every shot)
  // scanline / barcode bars on an edge
  if (on(7, b, 0.45)) { const x0 = boxX !== null ? (boxX < W / 2 ? W - 120 : 0) : ((b % 2) ? 0 : W - 120); ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 26; i++) ctx.fillRect(x0, 200 + i * 7, 40 + ((i * 37 + b * 11) % 80), 2); }

    ctx.fillStyle = '#fff'; ctx.font = '600 13px Cap'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(BADGE[b % BADGE.length], x, y); ctx.textBaseline = 'alphabetic'; }
}
window.ready = false;
const load = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
(async () => {

    A = await fetch('../analysis.json').then(r => r.json()); ctx = document.getElementById('c').getContext('2d');

    const ims = await Promise.all([16, 17, 18, 20, 24, 25, 27, 41, 43, 49, 52, 55].map(i => load(`../foot/c${i}/0030.jpg`)));
    for (const im of ims.filter(Boolean)) { const c = document.createElement('canvas'); c.width = 120; c.height = 76; const x = c.getContext('2d');

})();
window.renderBatch = (t0, n, fps) => { const r = []; for (let i = 0; i < n; i++) { render(t0 + i / fps); r.push(document.getElementById('c').toDataURL('image/png').slice(22)); } return r; };
</script></body></html>
