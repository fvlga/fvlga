<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="gl" width="1080" height="608" style="display:none"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// Kaleidoscope VFX: the Gemini kaleidoscope as a living, beat-driven shot. Deterministic per time t.
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D img; uniform float t, kick, bass, segs, segsPrev, morph, dir, hit, shock, pal; uniform vec2 res;
const float PI = 3.14159265;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
vec3 hue(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a); return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca); }
const float AR = 1024.0 / 572.0;
vec3 tex(vec2 q){ return texture(img, q).rgb; }  // MIRRORED_REPEAT wrap: folds never hit a hard edge
// image-space point from centred aspect-corrected coords (x in [-AR/2, AR/2], y in [-0.5, 0.5])
vec2 toUV(vec2 c){ return vec2(c.x / AR + 0.5, c.y + 0.5); }
vec2 fold(vec2 c, float n){ float r = length(c), a = atan(c.y, c.x), w = 2.0 * PI / n; a = mod(a, w); a = abs(a - w * 0.5); return vec2(cos(a), sin(a)) * r; }
void main(){
  vec2 c = (uv - 0.5) * vec2(AR, 1.0);
  float wt = floor(t * 24.0);
  c += (vec2(h(vec2(wt, 3.0)), h(vec2(wt, 4.0))) - 0.5) * 0.01 * kick;           // kick shake
  float R0 = 0.245 * (1.0 + 0.07 * kick + 0.03 * bass);                            // bubble radius (pumps on kicks)
  float r = length(c);
  // shockwave ring from the bubble on downbeats
  float sr = R0 + shock * 0.9, ring = exp(-pow((r - sr) * 22.0, 2.0)) * (1.0 - shock);
  c += normalize(c + 1e-5) * ring * 0.035;
  r = length(c);
  vec3 col;
  if (r > R0) {
    // pattern: rotate, breathe with bass, re-fold into a morphing kaleidoscope
    float rot = t * 0.22 * dir + 0.15 * sin(t * 0.7);
    vec2 pc = mat2(cos(rot), -sin(rot), sin(rot), cos(rot)) * c;
    float zoom = 1.0 - 0.06 * bass - 0.04 * kick + 0.03 * sin(t * 0.5);
    pc *= zoom;
    vec2 f1 = fold(pc, segsPrev), f2 = fold(pc, segs);
    vec2 fc = mix(f1, f2, smoothstep(0.0, 1.0, morph));
    fc.x += 0.18;                                                                   // sample off-centre so folds pull fresh detail
    float ab = 0.004 + 0.012 * kick + 0.03 * hit;
    vec2 q = toUV(fc);
    col = vec3(tex(q + vec2(ab, 0)).r, tex(q).g, tex(q - vec2(ab, 0)).b);
    col = hue(col, pal + kick * 0.25);                                                // original palette; new scheme every 4 bars
    float glow = 0.0; for (int i = 0; i < 8; i++) { float a = float(i) * 0.785; vec3 s = tex(q + vec2(cos(a), sin(a)) * 0.006); glow += max(max(s.r, max(s.g, s.b)) - 0.5, 0.0); }
    col += hue(vec3(1.0, 0.75, 0.3), pal) * glow / 8.0 * (1.0 + 1.8 * kick);
    col *= 0.85 + 0.35 * kick;
    col *= smoothstep(R0, R0 + 0.03, r) * 0.55 + 0.45;                            // shadow under the bubble rim
  } else {
    // bubble: liquid wobble + refraction of the original centre, moving highlight, flickering smiley
    float wob = sin(atan(c.y, c.x) * 5.0 + t * 3.0) * 0.012 + n2(c * 8.0 + t) * 0.01;
    vec2 bc = c * (1.0 + wob) / (1.0 + 0.07 * kick + 0.03 * bass);
    float d = r / R0;
    vec2 refr = bc * (1.0 - 0.18 * d * d);                                          // lens bulge
    vec2 q = toUV(refr);
    col = tex(q);
    float smile = smoothstep(0.55, 0.9, max(col.r, max(col.g, col.b)));            // the neon smiley strokes
    float flick = 0.8 + 0.2 * n2(vec2(t * 20.0, 1.0)) + 0.8 * kick - 0.6 * step(0.97, h(vec2(floor(t * 10.0), 2.0)));
    col += smile * vec3(0.6, 0.85, 1.0) * (flick - 1.0) * 1.4;
    vec2 hl = vec2(cos(t * 0.8), sin(t * 0.8)) * R0 * 0.55;                         // gliding specular highlight
    col += vec3(1.0) * exp(-dot(c - hl, c - hl) / (R0 * R0 * 0.012)) * 0.7;
    col += vec3(0.4, 0.6, 1.0) * pow(d, 6.0) * 0.6;                                 // fresnel rim
  }
  // glitch tears on hits
  float row = floor(uv.y * 60.0); col = mix(col, col.gbr, step(0.86, h(vec2(row, floor(t * 20.0)))) * hit);
  // film finish
  col += (h(uv * res + fract(t * 13.1) * 91.0) - 0.5) * 0.1;
  col *= 0.88 + 0.12 * sin(uv.y * res.y * 1.6);
  col *= 1.0 - 0.4 * pow(length((uv - 0.5) * vec2(1.1, 1.6)), 2.2);
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
let gl, U = {}, A, out, octx;
function init(analysis, image) {
  A = analysis; const cv = document.getElementById('gl'); gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
  const sh = (ty, s) => { const x = gl.createShader(ty); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, image);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  for (const n of ['t', 'kick', 'bass', 'segs', 'segsPrev', 'morph', 'dir', 'hit', 'shock', 'pal', 'res']) U[n] = gl.getUniformLocation(prog, n);
  gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U.res, cv.width, cv.height);
  out = document.getElementById('out'); octx = out.getContext('2d');
}
const SEGS = [8, 12, 6, 10, 8, 16, 6, 12];
function render(t) {
  const bp = 60 / A.bpm, beat = Math.max(0, (t - A.t0) / bp), kick = Math.exp(-((beat % 1) * bp) * 9);
  const f = Math.min(A.frames - 1, Math.max(0, Math.round(t * A.fps))), bass = A.bass[f];
  const block = Math.floor(beat / 8), within = (beat / 8) % 1;                     // new fold count every 2 bars
  const hit = (Math.floor(beat) % 4 === 0 && (beat % 1) < 0.2) ? 1 : 0;
  const shock = Math.floor(beat) % 4 === 0 ? Math.min(1, (beat % 1) * 1.6) : 1;
  gl.uniform1f(U.t, t); gl.uniform1f(U.kick, kick); gl.uniform1f(U.bass, bass);
  gl.uniform1f(U.segs, SEGS[block % SEGS.length]); gl.uniform1f(U.segsPrev, SEGS[(block + SEGS.length - 1) % SEGS.length]);
  gl.uniform1f(U.morph, Math.min(1, within * 4)); gl.uniform1f(U.dir, block % 2 ? -1 : 1); gl.uniform1f(U.hit, hit); gl.uniform1f(U.shock, shock); gl.uniform1f(U.pal, [0, 0, 2.094, 4.189][Math.floor(beat / 16) % 4]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  octx.fillStyle = '#000'; octx.fillRect(0, 0, out.width, out.height);
  const SH = 608, SY = Math.round((out.height - SH) / 2), z = 1 + 0.02 * kick;
  octx.save(); octx.translate(out.width / 2, SY + SH / 2); octx.scale(z, z); octx.drawImage(gl.canvas, -540, -SH / 2); octx.restore();
  octx.fillRect(0, 0, out.width, SY - 1); octx.fillRect(0, SY + SH + 1, out.width, out.height - SY - SH);
}
window.ready = false;
Promise.all([fetch('../analysis.json').then(r => r.json()), new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'kaleido.jpg'; })])
  .then(([a, im]) => { init(a, im); window.ready = true; }).catch(e => { window.err = String(e.stack || e); });
window.renderBatch = (t0, n, fps, q) => { const r = []; for (let i = 0; i < n; i++) { render(t0 + i / fps); r.push(out.toDataURL('image/jpeg', q).slice(23)); } return r; };
</script></body></html>
