<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Ser;src:url(../Playfair.ttf);font-weight:100 900}
@font-face{font-family:Mk;src:url(../PermanentMarker.ttf)}
@font-face{font-family:Cap;src:url(../Inter.ttf)}
@font-face{font-family:Mono;src:url(../VT323.ttf)}
@font-face{font-family:Scr;src:url(../Pinyon.ttf)}
html,body{margin:0;background:#000}</style></head><body><canvas id="c" width="1080" height="608"></canvas><script>
// New opening (v32): built from the video's own language instead of the old chrome-gothic title.
// 5 bars @148 BPM = 20 beats = 8.133 s. bar 1 burst (cuff / no / dancer / title), bar 2 hold (you in the scene + sticker),
// bar 3 burst (bands up hands up), bar 4 you pile up as stickers, bar 5 held title -> white-out into the first cut.
const W = 1080, H = 608, BP = 60 / 148, T0 = 0.01, YEL = '#E4FF3F', CREAM = '#F5E9A8', PINK = '#ff2e7e';
const SC = [ // [first beat, beats, clip]
  [0, 1, 16], [1, 1, 82], [2, 1, 85], [3, 1, 91], [4, 4, 95], [8, 1, 17], [9, 1, 61], [10, 1, 80], [11, 1, 65], [12, 1, 60], [13, 1, 68], [14, 1, 41], [15, 1, 20], [16, 4, 97]];
const WORDS = { 0: 'cuff', 1: 'no', 2: 'dancer', 8: 'bands', 9: 'up', 10: 'hands', 11: 'up', 12: 'river', 13: 'gold', 14: 'gone', 15: 'outside' };
let ctx, man, FR = {}, CO = {};
const ease = u => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);
const back = u => { u = Math.min(1, Math.max(0, u)); return 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2); };
const rng = s => () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
function footage(clip, t, zoom) {   // teal-graded 1960s frame, cover-fit into the strip
  const n = man[clip].n, i = Math.floor(t * 15) % n + 1, im = FR[clip + '_' + i] || FR[clip + '_1'];
  const s = Math.max(W / im.width, H / im.height) * zoom, w = im.width * s, h = im.height * s;
  ctx.save(); ctx.filter = 'saturate(0.62) contrast(1.12) brightness(0.96)'; ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(20,135,165,0.62)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(170,215,225,0.28)'; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function giant(txt, age, color, maxW, maxH, dy) {   // fitted serif word, slams in (3x -> 1x) with a hard stop
  let px = 320; ctx.font = 'italic 900 ' + px + 'px Ser'; const m = ctx.measureText(txt).width; px = Math.min(maxH, px * Math.min(1, maxW / m));
  const s = 1 + 2.1 * (1 - ease(age / 0.13)) + (age < 0.2 ? 0 : 0);
  ctx.save(); ctx.translate(W / 2, H / 2 + dy); ctx.scale(s, s); ctx.font = 'italic 900 ' + px + 'px Ser'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = px * 0.07; ctx.strokeStyle = '#0b0b0b'; ctx.strokeText(txt, 0, 0); ctx.fillStyle = color; ctx.fillText(txt, 0, 0); ctx.restore();
}
// ---- letter collage: every letter is its own hand-cut paper tile in its own font, composed on purpose ----
// rules that keep it "artist, not sloppy": equal tile height (+-8%), tight even gaps, small tilts (+-3 deg), 6 paper colours,
// never the same font or paper twice in a row, at most one pink tile per word, one piece of tape, jittered-but-clean cut edges.
const LF = [(px) => 'italic 900 ' + px + 'px Ser', (px) => '900 ' + px + 'px Ser', (px) => px + 'px Mk', (px) => (px * 1.15) + 'px Mono', (px) => '800 ' + (px * 0.82) + 'px Cap', (px) => 'italic 400 ' + px + 'px Ser'];
const LUP = [false, false, false, true, true, false];   // fonts that look right in capitals
const PAP = [['#F5E9A8', '#14110d'], ['#14110d', '#E4FF3F'], ['#E4FF3F', '#14110d'], ['#ff2e7e', '#fff6c8'], ['#f4f4f2', '#14110d'], ['#1f6f86', '#F5E9A8']];
function collageWord(txt, age, maxW, maxH, dy, seed) {
  const r = rng(seed * 733 + 11), hs0 = Math.min(maxH, 300), items = []; let pf = -1, pp = -1, pinkUsed = false, taped = false;
  const xh = LF.map((f, i) => { ctx.font = f(200); const m = ctx.measureText(LUP[i] ? 'X' : 'x'); return m.actualBoundingBoxAscent; });
  [...txt].forEach(ch => {
    if (ch === ' ') { items.push({ gap: hs0 * 0.3 }); return; }
    let f; do { f = Math.floor(r() * 6); } while (f === pf); pf = f;
    let p; do { p = Math.floor(r() * 6); } while (p === pp || (p === 3 && pinkUsed)); pp = p; if (p === 3) pinkUsed = true;
    const g = LUP[f] ? ch.toUpperCase() : ch, hs = hs0 * (0.92 + r() * 0.16);
    ctx.font = LF[f](200); const m = ctx.measureText(g), gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    let gs = (0.5 * hs) / xh[f]; if (gh * gs > 0.86 * hs) gs *= 0.86 * hs / (gh * gs);
    const w = Math.max(gw * gs + 0.36 * hs, 0.55 * hs);
    items.push({ ch: g, f, p, hs, gs, w, gw, gh, m, rot: (r() - 0.5) * 0.1, up: (r() - 0.5) * 0.1 * hs0, tape: !taped && r() > 0.7 && (taped = true), jit: [0, 1, 2, 3, 4, 5, 6, 7].map(() => (r() - 0.5) * 0.035) });
  });
  const total = items.reduce((a, it) => a + (it.gap || it.w) + hs0 * 0.04, 0), k = Math.min(1.25, maxW / total);
  let x = -total * k / 2, li = 0; ctx.save(); ctx.translate(W / 2, H / 2 + dy);
  for (const it of items) {
    if (it.gap) { x += (it.gap + hs0 * 0.04) * k; continue; }
    const a = age - li * 0.028; li++; if (a < 0) { x += (it.w + hs0 * 0.04) * k; continue; }
    const e = ease(a / 0.13), sc = 1 + 1.7 * (1 - e), cx = x + it.w * k / 2, w = it.w * k, h = it.hs * k, pair = PAP[it.p];
    ctx.save(); ctx.translate(cx, it.up * k); ctx.rotate(it.rot + (1 - e) * 0.5 * (li % 2 ? 1 : -1)); ctx.scale(sc, sc);
    const pts = [[-w / 2, -h / 2], [0, -h / 2], [w / 2, -h / 2], [w / 2, 0], [w / 2, h / 2], [0, h / 2], [-w / 2, h / 2], [-w / 2, 0]].map((q, i) => [q[0] + it.jit[i] * w, q[1] + it.jit[(i + 3) % 8] * h]);
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12 * k; ctx.shadowOffsetY = 6 * k;
    ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.fillStyle = pair[0]; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.lineWidth = Math.max(1, 2 * k); ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke();
    const fpx = 200 * it.gs * k; ctx.font = LF[it.f](fpx); ctx.fillStyle = pair[1]; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(it.ch, -(it.gw * it.gs * k) / 2 + it.m.actualBoundingBoxLeft * it.gs * k, (it.m.actualBoundingBoxAscent - it.gh / 2) * it.gs * k);
    if (it.tape) { ctx.save(); ctx.translate(w * 0.12, -h / 2); ctx.rotate(-0.12); ctx.fillStyle = 'rgba(235,225,200,.78)'; ctx.fillRect(-w * 0.22, -h * 0.07, w * 0.44, h * 0.14); ctx.restore(); }
    ctx.restore(); x += (it.w + hs0 * 0.04) * k;
  }
  ctx.restore();
}
function sticker(cx, cy, sc, rot) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(4, 5, 82, 29, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PINK; ctx.beginPath(); ctx.ellipse(0, 0, 82, 29, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(0, 0, 77, 24, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = YEL; ctx.font = 'italic 800 27px Ser'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('fvlga', 0, 1); ctx.restore();
}
function popSticker(t, bt, kick) {   // edge zones only (the giant words own the middle)
  const STY = [['italic 800 27px Ser', '#E4FF3F', 1], ['35px Scr', '#ffffff', -3], ['24px Mk', '#16120d', 0], ['30px Mono', '#3ff0ff', 2], ['800 21px Cap', '#ffffff', 1], ['900 28px Ser', '#fff6c8', 1], ['italic 800 27px Ser', '#c8ff2e', 1], ['24px Mk', '#ffffff', 0]];
  const w = Math.floor(Math.max(0, bt - 4) / 2), styOf = ww => { const i = Math.floor(rng(ww * 211 + 17)() * 8), pr = Math.floor(rng((ww - 1) * 211 + 17)() * 8); return i === pr ? (i + 3) % 8 : i; };
  const r = rng(w * 1013 + 5), zone = Math.floor(r() * 4); let x, y;
  if (zone === 0) { x = 110 + r() * (W - 220); y = 44 + r() * 50; } else if (zone === 1) { x = 110 + r() * (W - 220); y = H - 44 - r() * 50; }
  else if (zone === 2) { x = 100 + r() * 70; y = 130 + r() * (H - 260); } else { x = W - 100 - r() * 70; y = 130 + r() * (H - 260); }
  const st = STY[styOf(w)], age = Math.max(0, (bt - 4 - w * 2) * BP), u = Math.min(1, age / 0.2), pop = u < 1 ? 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2) : 1;
  const sc = (0.85 + r() * 0.4) * pop * (1 + 0.035 * kick), rot = (r() - 0.5) * 0.5;
  ctx.save(); ctx.globalAlpha = Math.min(1, u * 4); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(4, 5, 82, 29, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PINK; ctx.beginPath(); ctx.ellipse(0, 0, 82, 29, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(0, 0, 77, 24, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = st[1]; ctx.font = st[0]; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('fvlga', 0, 1 + st[2]); ctx.restore();
}
function cutout(name, x, feet, h, age, flip) {   // artist cut-out with a white sticker edge, pops with a bounce
  const im = CO[name], s = h / im.height, w = im.width * s, p = back(age / 0.16), a = Math.min(1, age / 0.05);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, feet); ctx.scale(p, p); ctx.rotate((flip ? -1 : 1) * 0.05 * (1 - ease(age / 0.3)));
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  const tmp = document.createElement('canvas'); tmp.width = Math.ceil(w) + 24; tmp.height = Math.ceil(h) + 24; const t = tmp.getContext('2d');
  for (const [dx, dy] of [[-4, 0], [4, 0], [0, -4], [0, 4], [-3, -3], [3, 3], [-3, 3], [3, -3]]) t.drawImage(im, 12 + dx, 12 + dy, w, h);
  t.globalCompositeOperation = 'source-in'; t.fillStyle = '#eef3f7'; t.fillRect(0, 0, tmp.width, tmp.height); t.globalCompositeOperation = 'source-over'; t.drawImage(im, 12, 12, w, h);
  ctx.drawImage(tmp, -tmp.width / 2, -tmp.height + 12); ctx.restore();
}
function note(txt, cx, cy, rot, age) {   // marker-on-sticky-note quote
  const p = back(age / 0.16); ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-92, -56, 190, 120); ctx.fillStyle = YEL; ctx.fillRect(-98, -62, 190, 120);
  ctx.fillStyle = 'rgba(235,225,200,.8)'; ctx.fillRect(-34, -72, 68, 20); ctx.fillStyle = '#16120d'; ctx.font = '25px Mk'; ctx.textAlign = 'left';
  txt.split('|').forEach((ln, i) => ctx.fillText(ln, -84, -22 + i * 30)); ctx.restore();
}
function render(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const bt = Math.max(0, (t - T0) / BP), bi = Math.min(19, Math.floor(bt)), age = (bt - bi) * BP;   // age = seconds since this beat
  const sc = SC.find(s => bi >= s[0] && bi < s[0] + s[1]) || SC[SC.length - 1];
  const local = (bt - sc[0]) * BP, kick = Math.exp(-age * 9);
  const zoom = 1.04 + 0.05 * kick + (sc[1] > 1 ? 0.035 * (local / (sc[1] * BP)) : 0);
  footage(sc[2], Math.max(0, local), zoom);
  ctx.save(); ctx.globalCompositeOperation = 'source-over'; const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  // words
  if (WORDS[bi]) collageWord(WORDS[bi], age, W * 0.9, 330, 0, bi + 1);
  if (bi === 3) collageWord('cuff no dancer', age, W * 0.95, 150, -6, 31);
  if (bi >= 16) {   // bar 5: the title stacked, held
    const a = (bt - 16) * BP, lines = [['cuff', -150, YEL], ['no', 0, CREAM], ['dancer', 150, YEL]];
    lines.forEach(([w2, dy, col], i) => collageWord(w2, a - i * 0.2, W * 0.72, 150, dy, 50 + i));
  }
  // hold bar: a sticky note pops in; the pink sticker pops around the edges from bar 2 on, new font + colour each time
  if (bi >= 6 && bi < 8) note('stay|outside', 170, 190, -0.07, (bt - 6) * BP);
  if (bi >= 4) popSticker(t, bt, kick);
  // end: white-out into the first cut
  const fl = Math.min(1, Math.max(0, (t - (8.133 - 0.2)) / 0.2)); if (fl > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (fl * fl) + ')'; ctx.fillRect(0, 0, W, H); }
  // beat flash on the downbeat of each bar
  if (bi % 4 === 0 && age < 0.05) { ctx.fillStyle = 'rgba(255,255,255,' + 0.35 * (1 - age / 0.05) + ')'; ctx.fillRect(0, 0, W, H); }
  // film grain
  const r = rng(Math.floor(t * 30) * 7919 + 13); ctx.save(); ctx.globalAlpha = 0.09; for (let i = 0; i < 700; i++) { ctx.fillStyle = r() > 0.5 ? '#fff' : '#000'; ctx.fillRect(r() * W, r() * H, 2, 2); } ctx.restore();
}
const load = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
window.ready = false;
(async () => {
  try {
    ctx = document.getElementById('c').getContext('2d'); man = await fetch('../foot/manifest.json').then(r => r.json());
    await document.fonts.load('italic 900 40px Ser'); await document.fonts.load('900 40px Ser'); await document.fonts.load('italic 400 40px Ser'); await document.fonts.load('20px Mk'); await document.fonts.load('20px Cap'); await document.fonts.load('30px Mono'); await document.fonts.load('30px Scr');
    const jobs = []; for (const s of SC) for (let i = 1; i <= Math.min(man[s[2]].n, 30); i++) jobs.push(load(`../foot/c${s[2]}/${String(i).padStart(4, '0')}.jpg`).then(im => { if (im) FR[s[2] + '_' + i] = im; }));
    await Promise.all(jobs); window.ready = true;
  } catch (e) { window.err = String(e.stack || e); }
})();
window.renderBatch = (t0, n, fps, q) => { const out = []; for (let i = 0; i < n; i++) { render(t0 + i / fps); out.push(document.getElementById('c').toDataURL('image/jpeg', q).slice(23)); } return out; };
</script></body></html>
