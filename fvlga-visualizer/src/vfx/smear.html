<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="gl" width="1080" height="608" style="display:none"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// Smeared title VFX: drips melt downward in streaks, bass-breathing vertical smear, VHS tracking band,
// flickering neon "getting", sigil glow on kicks, green half flips to hot pink on alternate bars. Deterministic per time t.
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D A, B; uniform float t, kick, bass, hit, mixAB, rot; uniform vec2 res;
const float AR = 1024.0 / 572.0;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n1(float x){ float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(h(vec2(i, 7.0)), h(vec2(i + 1.0, 7.0)), f); }
vec3 tex(vec2 q){ return texture(A, clamp(q, 0.001, 0.999)).rgb; }
void main(){
  float wt = floor(t * 24.0);
  vec2 q = (uv - 0.5) / (1.0 + 0.035 * kick + 0.015 * bass) + 0.5;
  q += (vec2(h(vec2(wt, 3.0)), h(vec2(wt, 4.0))) - 0.5) * 0.008 * kick;
  // VHS tracking: a rolling band of horizontal jitter + per-line wobble
  float band = exp(-pow((uv.y - fract(t * 0.35)) * 14.0, 2.0));
  q.x += (h(vec2(floor(uv.y * 200.0), wt)) - 0.5) * (0.0012 + 0.012 * band + 0.03 * hit);
  // melt: content slides down in x-dependent streaks, growing through each 2-bar cycle (rot = cycle phase)
  float streak = pow(n1(uv.x * 46.0), 3.0) * 0.6 + 0.4 * pow(n1(uv.x * 140.0 + 3.0), 4.0);
  float melt = streak * (0.008 + 0.035 * rot) * smoothstep(0.3, 0.9, q.y);
  vec2 qm = q - vec2(0.0, melt);
  // vertical smear that breathes with the bass: average samples above
  vec3 col = vec3(0.0); float sm = 0.004 + 0.018 * bass + 0.012 * kick;
  for (int i = 0; i < 8; i++) col += tex(qm - vec2(0.0, sm * float(i) / 7.0));
  col /= 8.0;
  vec3 base = tex(q);
  // chroma bleed
  float ab = 0.003 + 0.01 * kick + 0.02 * hit;
  col.r = mix(col.r, tex(qm + vec2(ab, 0.0)).r, 0.6); col.b = mix(col.b, tex(qm - vec2(ab, 0.0)).b, 0.6);
  // acid green half pulses on kicks; flips to hot pink on alternate bars (mixAB)
  float gm = smoothstep(0.25, 0.45, col.g - max(col.r * 0.8, col.b));
  vec3 alt = vec3(1.0, 0.2, 0.68) * dot(col, vec3(0.3, 0.6, 0.1)) * 1.15;
  col = mix(col, mix(col, alt, mixAB) * (0.9 + 0.25 * kick), gm);
  // neon "getting": tube flicker + bloom
  vec3 nb = vec3(0.0); for (int i = 0; i < 8; i++) { float a = float(i) * 0.785; vec3 s = tex(q + vec2(cos(a), sin(a) * AR) * 0.012); nb += s * smoothstep(0.25, 0.5, s.r - max(s.g, s.b)); }
  float rm = smoothstep(0.25, 0.5, base.r - max(base.g, base.b));
  float fl = 0.75 + 0.25 * n1(t * 23.0) - 0.85 * step(0.9, h(vec2(floor(t * 12.0), 5.0)));
  col = mix(col, col * fl, rm);
  col += nb / 8.0 * vec3(1.0, 0.15, 0.2) * (0.6 + 0.8 * kick) * max(fl, 0.0);
  // sun sigil glows on kicks (thin grey lines around the centre)
  float sg = smoothstep(0.24, 0.0, length((q - vec2(0.5, 0.47)) * vec2(AR, 1.0)));
  float line = smoothstep(0.35, 0.6, dot(base, vec3(0.33))) * (1.0 - gm) * sg;
  col += vec3(0.85, 1.0, 0.85) * line * kick * 0.6;
  // downbeat flash + slice tears
  float row = floor(uv.y * 36.0);
  col = mix(col, col.brg, step(0.85, h(vec2(row, wt))) * hit);
  col += vec3(0.9, 1.0, 0.8) * hit * 0.15;
  // finish
  col += (h(uv * res + fract(t * 13.1) * 91.0) - 0.5) * 0.1;
  col *= 0.9 + 0.1 * sin(uv.y * res.y * 1.5);
  col *= 1.0 - 0.35 * pow(length((uv - 0.5) * vec2(1.1, 1.6)), 2.2);
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
let gl, U = {}, AN, out, octx;
function init(analysis, ims) {
  AN = analysis; const cv = document.getElementById('gl'); gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
  const sh = (ty, s) => { const x = gl.createShader(ty); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ims.forEach((im, i) => { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); });
  for (const n of ['A', 'B', 't', 'kick', 'bass', 'hit', 'mixAB', 'rot', 'res']) U[n] = gl.getUniformLocation(prog, n);
  gl.uniform1i(U.A, 0); gl.uniform1i(U.B, 1); gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U.res, cv.width, cv.height);
  out = document.getElementById('out'); octx = out.getContext('2d');
}
function render(t) {
  const bp = 60 / AN.bpm, beat = Math.max(0, (t - AN.t0) / bp), ph = beat % 1, kick = Math.exp(-(ph * bp) * 9);
  const f = Math.min(AN.frames - 1, Math.max(0, Math.round(t * AN.fps))), bass = AN.bass[f];
  const hit = (Math.floor(beat) % 4 === 0 && ph < 0.12) ? 1 : 0;
  const mixAB = Math.floor(beat / 4) % 2, rot = ((beat / 8) % 1);
  gl.uniform1f(U.t, t); gl.uniform1f(U.kick, kick); gl.uniform1f(U.bass, bass); gl.uniform1f(U.hit, hit); gl.uniform1f(U.mixAB, mixAB); gl.uniform1f(U.rot, rot);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  octx.fillStyle = '#000'; octx.fillRect(0, 0, out.width, out.height);
  const SH = 608, SY = Math.round((out.height - SH) / 2), z = 1 + 0.02 * kick;
  octx.save(); octx.translate(out.width / 2, SY + SH / 2); octx.scale(z, z); octx.drawImage(gl.canvas, -540, -SH / 2); octx.restore();
  octx.fillRect(0, 0, out.width, SY - 1); octx.fillRect(0, SY + SH + 1, out.width, out.height - SY - SH);
}
window.ready = false;
const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
Promise.all([fetch('../analysis.json').then(r => r.json()), load('smear.jpg'), load('smear.jpg')])
  .then(([a, i0, i1]) => { init(a, [i0, i1]); window.ready = true; }).catch(e => { window.err = String(e.stack || e); });
window.renderBatch = (t0, n, fps, q) => { const r = []; for (let i = 0; i < n; i++) { render(t0 + i / fps); r.push(out.toDataURL('image/jpeg', q).slice(23)); } return r; };
</script></body></html>
