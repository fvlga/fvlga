<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="gl" width="1080" height="608" style="display:none"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// Gothic echo VFX: chrome 'fvlga' with rippling neon rings, growing drips, falling droplets, twinkling stars. Deterministic per time t.
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D img; uniform float t, kick, bass, hit, ripple, bar; uniform vec2 res;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
vec3 tex(vec2 q){ return texture(img, clamp(q, 0.001, 0.999)).rgb; }
float sat(vec3 c){ return max(c.r, max(c.g, c.b)) - min(c.r, min(c.g, c.b)); }
const vec2 CEN = vec2(0.515, 0.47);           // centre of the lettering/rings
const float AR = 1024.0 / 572.0;
void main(){
  float wt = floor(t * 24.0);
  vec2 shake = (vec2(h(vec2(wt, 3.0)), h(vec2(wt, 4.0))) - 0.5) * 0.008 * kick;
  float zoom = 1.04 + 0.06 * fract(t / 20.0) * 0.0 + 0.03 * sin(t * 0.25) + 0.03 * kick;
  vec2 c = (uv - 0.5) / zoom + 0.5 + shake + vec2(sin(t * 0.33), cos(t * 0.27)) * 0.004;
  // layers: chrome letters (bright, low saturation, central), neon rings (saturated green/pink), stars (everything else bright)
  vec2 ql = c + vec2(0.0, sin(t * 1.1) * 0.006);                                   // letters float
  // drip stretch: below the baseline, pull the image up so drips extend downward, resetting each bar
  float base = 0.66, grow = 1.0 + 0.22 * fract(t / (bar * 2.0));
  if (ql.y > base) ql.y = base + (ql.y - base) / grow;
  vec3 L = tex(ql);
  float inBox = step(0.22, ql.x) * step(ql.x, 0.8) * step(0.22, ql.y) * step(ql.y, 0.95);
  float chrome = smoothstep(0.32, 0.55, max(L.r, max(L.g, L.b))) * (1.0 - smoothstep(0.18, 0.35, sat(L))) * inBox;
  // rings: radial ripple flowing outward + kick echo burst (ring layer scaled outward)
  vec2 d = (c - CEN) * vec2(AR, 1.0); float r = length(d);
  vec3 R0 = tex(c), Rk = tex(CEN + (c - CEN) / (1.0 + 0.10 * kick));
  float ringM0 = smoothstep(0.25, 0.45, sat(R0)), ringMk = smoothstep(0.25, 0.45, sat(Rk));
  float wave = 0.55 + 0.45 * sin(r * 38.0 - t * 7.0) + 0.6 * exp(-pow((r - ripple * 0.9) * 10.0, 2.0));
  vec3 rings = R0 * ringM0 * wave * (1.0 + 0.8 * kick) + Rk * ringMk * 0.6 * kick;
  // stars: twinkle existing ones, sprinkle new ones
  float starM = smoothstep(0.55, 0.85, max(R0.r, max(R0.g, R0.b))) * (1.0 - smoothstep(0.15, 0.3, sat(R0))) * (1.0 - inBox);
  float tw = 0.4 + 0.6 * n2(floor(c * 60.0) + t * 3.0);
  vec3 col = rings + R0 * starM * tw * 1.6;
  vec2 sp = uv * vec2(60.0 * AR, 60.0); vec2 sid = floor(sp); float sr = h(sid);
  if (sr > 0.985) { float d2 = length(fract(sp) - 0.5); float b = pow(max(0.0, sin(t * (2.0 + sr * 5.0) + sr * 40.0)), 8.0);
    col += vec3(1.0) * (smoothstep(0.12, 0.0, d2) + smoothstep(0.03, 0.0, abs(fract(sp.x) - 0.5)) * smoothstep(0.4, 0.0, abs(fract(sp.y) - 0.5)) * 0.6) * b; }
  // composite chrome on top, with specular sweep
  float sw = fract(t / (bar * 2.0)) * 1.8 - 0.4;
  float band = exp(-pow((ql.x + (ql.y - 0.5) * 0.45 - sw) * 14.0, 2.0));
  vec3 chromeCol = L * (1.0 + 0.25 * kick) + vec3(1.0) * band * 0.9;
  col = mix(col, chromeCol, chrome);
  // falling chrome droplets from the drip tips
  float tips[5] = float[5](0.297, 0.405, 0.492, 0.607, 0.745);
  for (int i = 0; i < 5; i++) { float ph = fract(t / (bar * 2.0) + float(i) * 0.27); float y = 0.83 + ph * 0.35;
    vec2 dd = (uv - vec2(tips[i], y)) * vec2(AR, 1.0); float rr = length(dd * vec2(1.0, 0.75));
    float drop = smoothstep(0.012, 0.009, rr) * (1.0 - ph);
    vec3 shade = mix(vec3(0.35), vec3(1.0), smoothstep(-0.01, 0.012, -dd.x - dd.y));
    col = mix(col, shade, drop); }
  // finish: RGB split on kicks, glitch tears, grain, scanlines, vignette
  float row = floor(uv.y * 60.0), g = step(0.84, h(vec2(row, floor(t * 20.0)))) * hit;
  col = mix(col, vec3(col.r * 1.2, col.g * 0.6, col.b * 1.2), g);
  col += (h(uv * res + fract(t * 13.1) * 91.0) - 0.5) * 0.09;
  col *= 0.88 + 0.12 * sin(uv.y * res.y * 1.6);
  col *= 1.0 - 0.4 * pow(length((uv - 0.5) * vec2(1.1, 1.6)), 2.2);
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
let gl, U = {}, A, out, octx;
function init(analysis, image) {
  A = analysis; const cv = document.getElementById('gl'); gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
  const sh = (ty, s) => { const x = gl.createShader(ty); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, image);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  for (const n of ['t', 'kick', 'bass', 'hit', 'ripple', 'bar', 'res']) U[n] = gl.getUniformLocation(prog, n);
  gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U.res, cv.width, cv.height);
  out = document.getElementById('out'); octx = out.getContext('2d');
}
const SEGS = [8, 12, 6, 10, 8, 16, 6, 12];
function render(t) {
  const bp = 60 / A.bpm, beat = Math.max(0, (t - A.t0) / bp), kick = Math.exp(-((beat % 1) * bp) * 9);
  const f = Math.min(A.frames - 1, Math.max(0, Math.round(t * A.fps))), bass = A.bass[f];
  const hit = (Math.floor(beat) % 4 === 0 && (beat % 1) < 0.2) ? 1 : 0;
  gl.uniform1f(U.t, t); gl.uniform1f(U.kick, kick); gl.uniform1f(U.bass, bass); gl.uniform1f(U.hit, hit);
  gl.uniform1f(U.ripple, (beat % 2) / 2); gl.uniform1f(U.bar, bp * 4);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  octx.fillStyle = '#000'; octx.fillRect(0, 0, out.width, out.height);
  const SH = 608, SY = Math.round((out.height - SH) / 2), z = 1 + 0.02 * kick;
  octx.save(); octx.translate(out.width / 2, SY + SH / 2); octx.scale(z, z); octx.drawImage(gl.canvas, -540, -SH / 2); octx.restore();
  octx.fillRect(0, 0, out.width, SY - 1); octx.fillRect(0, SY + SH + 1, out.width, out.height - SY - SH);
}
window.ready = false;
Promise.all([fetch('../analysis.json').then(r => r.json()), new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'gothic.jpg'; })])
  .then(([a, im]) => { init(a, im); window.ready = true; }).catch(e => { window.err = String(e.stack || e); });
window.renderBatch = (t0, n, fps, q) => { const r = []; for (let i = 0; i < n; i++) { render(t0 + i / fps); r.push(out.toDataURL('image/jpeg', q).slice(23)); } return r; };
</script></body></html>
