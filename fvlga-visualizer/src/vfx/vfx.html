<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="gl" width="1080" height="608" style="display:none"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// Title VFX shot: one still (Gemini art) turned into a living shot. All effects are in one fragment shader,
// driven by time + the song's beat grid and bass. Deterministic per frame for offline rendering.
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D img; uniform float t, kick, bass, bar, hit, intro, outro; uniform vec2 res;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
vec3 tex(vec2 q){ return texture(img, clamp(q, 0.001, 0.999)).rgb; }
float textMask(vec2 q){ vec3 c = tex(q); float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));
  float chrome = smoothstep(0.38, 0.62, mx) * (1.0 - smoothstep(0.25, 0.55, mx - mn));        // bright, low-saturation metal
  float pinkMetal = smoothstep(0.35, 0.6, mx) * smoothstep(0.15, 0.35, (c.r + c.b) * 0.5 - c.g); // pink-lit chrome faces
  return clamp(max(chrome, pinkMetal * 0.9), 0.0, 1.0); }
void main(){
  vec2 q = uv;
  // gate weave + handheld drift + kick shake
  float wt = floor(t * 24.0);
  vec2 weave = vec2(h(vec2(wt, 1.0)) - 0.5, h(vec2(wt, 2.0)) - 0.5) * 0.0012;
  vec2 drift = vec2(sin(t * 0.37) * 0.006 + sin(t * 0.91) * 0.002, cos(t * 0.29) * 0.004);
  vec2 shake = (vec2(h(vec2(wt, 3.0)), h(vec2(wt, 4.0))) - 0.5) * 0.012 * kick;
  // camera: slow push-in + kick punch, slight roll
  float zoom = 1.0 + 0.10 * smoothstep(0.0, 9.0, t) + 0.025 * kick + 0.25 * (1.0 - smoothstep(0.0, 0.9, t)) * intro;
  float roll = sin(t * 0.21) * 0.012;
  vec2 c = q - 0.5; c = mat2(cos(roll), -sin(roll), sin(roll), cos(roll)) * c; c /= zoom; q = c + 0.5 + drift + weave + shake;
  // parallax: the chrome lettering sits nearer the lens than the room
  float m0 = textMask(q);
  vec2 par = vec2(sin(t * 0.37), cos(t * 0.29)) * 0.0022;
  vec2 qt = q + par * 0.9, qb = q - par * 0.35;
  float m = textMask(qt);
  // heat haze in the room, liquid ripple down the drips
  vec2 haze = vec2(n2(qb * 18.0 + vec2(0.0, t * 1.6)) - 0.5, n2(qb * 18.0 + vec2(9.0, t * 1.3)) - 0.5) * 0.004;
  float dripZone = smoothstep(0.5, 0.62, qt.y);
  qt.x += sin(qt.y * 140.0 - t * 7.0) * 0.0016 * dripZone;
  qt.y += sin(qt.y * 60.0 - t * 4.0) * 0.0012 * dripZone;
  // glitch tears on downbeat hits
  float row = floor(q.y * 70.0), g = step(0.82, h(vec2(row, floor(t * 20.0)))) * hit;
  float tear = g * (h(vec2(row, t)) - 0.5) * 0.08;
  qt.x += tear; qb.x += tear;
  // RGB split (stronger on kicks)
  float ab = 0.0006 + 0.0045 * kick + 0.02 * g;
  vec3 bg = vec3(tex(qb + haze + vec2(ab, 0)).r, tex(qb + haze).g, tex(qb + haze - vec2(ab, 0)).b);
  vec3 fg = vec3(tex(qt + vec2(ab, 0)).r, tex(qt).g, tex(qt - vec2(ab, 0)).b);
  vec3 col = mix(bg, fg, m);
  // neon: green echo flickers on the beat, pink light breathes with the bass
  vec3 src = tex(qb);
  float green = smoothstep(0.06, 0.22, src.g - max(src.r, src.b));
  float flick = 0.75 + 0.25 * n2(vec2(t * 18.0, 0.0)) + 0.9 * kick - 0.7 * step(0.965, h(vec2(floor(t * 12.0), 7.0)));
  col += green * col * (flick - 1.0) * 1.2;
  float pink = smoothstep(0.08, 0.25, (src.r + src.b) * 0.5 - src.g);
  col += pink * col * (0.25 + 1.1 * bass);
  // chrome specular sweep every 2 bars
  float sw = fract(t / (bar * 2.0)) * 1.8 - 0.4;
  float band = exp(-pow((qt.x + (qt.y - 0.5) * 0.45 - sw) * 16.0, 2.0));
  col += vec3(1.0, 0.95, 1.0) * band * m * 0.9;
  // bloom: cheap 12-tap glow from bright areas
  vec3 glow = vec3(0.0);
  for (int i = 0; i < 12; i++) { float a = float(i) * 0.5236; vec2 d = vec2(cos(a), sin(a)) * (0.003 + 0.002 * float(i % 3));
    vec3 s = tex(qb + d); glow += max(s - 0.45, 0.0); }
  col += glow / 12.0 * (1.1 + 1.4 * kick) * vec3(1.0, 0.85, 1.05);
  // floating dust motes in the light
  for (int L = 0; L < 3; L++) { float sc = 18.0 + float(L) * 14.0; vec2 pp = uv * vec2(sc * res.x / res.y, sc) + vec2(t * 0.25 * (1.0 + float(L)), -t * (0.6 + 0.3 * float(L)));
    vec2 id = floor(pp), f = fract(pp) - 0.5; float r = h(id + float(L) * 13.0);
    if (r > 0.9) { vec2 o2 = vec2(h(id + 1.7), h(id + 3.1)) - 0.5; float d = length(f - o2 * 0.6); col += vec3(1.0, 0.8, 0.95) * smoothstep(0.06, 0.0, d) * (0.35 + 0.4 * kick) * (1.0 - float(L) * 0.25); } }
  // light leak drifting across
  float lk = smoothstep(0.7, 0.0, length((uv - vec2(0.15 + 0.7 * fract(t * 0.06), 0.2)) * vec2(1.4, 2.2)));
  col += vec3(1.0, 0.35, 0.55) * lk * 0.22;
  // film: grain, dust, scratches, flicker, vignette
  col += (h(uv * res + fract(t * 13.1) * 91.0) - 0.5) * 0.11;
  float dust = step(0.9993, h(floor(uv * res / 3.0) + floor(t * 24.0) * 7.0)); col = mix(col, vec3(0.9), dust * 0.8);
  float sx = h(vec2(floor(t * 24.0), 11.0)); col += step(0.75, h(vec2(floor(t * 6.0), 5.0))) * smoothstep(0.0015, 0.0, abs(uv.x - sx)) * 0.35;
  col *= 0.94 + 0.06 * h(vec2(floor(t * 24.0), 9.0));
  col *= 1.0 - 0.45 * pow(length((uv - 0.5) * vec2(1.1, 1.6)), 2.2);
  col *= 0.88 + 0.12 * sin(uv.y * res.y * 1.6);
  // in/out: flash from white at the start, crush to black + glitch at the end
  col = mix(col, vec3(1.0), (1.0 - smoothstep(0.0, 0.35, t)) * intro);
  col *= 1.0 - outro;
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
let gl, prog, U = {}, A, out, octx;
function init(analysis, image) {
  A = analysis; const c = document.getElementById('gl'); gl = c.getContext('webgl2', { preserveDrawingBuffer: true });
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, image);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  for (const n of ['t', 'kick', 'bass', 'bar', 'hit', 'intro', 'outro', 'res']) U[n] = gl.getUniformLocation(prog, n);
  gl.viewport(0, 0, c.width, c.height); gl.uniform2f(U.res, c.width, c.height);
  out = document.getElementById('out'); octx = out.getContext('2d');
}
// t = song time; len = shot length (for the outro crush)
function render(t, len) {
  const bp = 60 / A.bpm, beat = Math.max(0, (t - A.t0) / bp), kick = Math.exp(-((beat % 1) * bp) * 9);
  const f = Math.min(A.frames - 1, Math.max(0, Math.round(t * A.fps))), bass = A.bass[f];
  const hit = (Math.floor(beat) % 4 === 0 && (beat % 1) < 0.25) ? 1 : 0;
  const outro = Math.min(1, Math.max(0, (t - (len - 0.25)) / 0.25));
  gl.uniform1f(U.t, t); gl.uniform1f(U.kick, kick); gl.uniform1f(U.bass, bass); gl.uniform1f(U.bar, bp * 4); gl.uniform1f(U.hit, hit + (t > len - 0.5 ? 1 : 0));
  gl.uniform1f(U.intro, 1); gl.uniform1f(U.outro, outro * 0.0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  octx.fillStyle = '#000'; octx.fillRect(0, 0, out.width, out.height);
  const SH = 608, SY = Math.round((out.height - SH) / 2), z = 1 + 0.02 * kick;
  octx.save(); octx.translate(out.width / 2, SY + SH / 2); octx.scale(z, z); octx.drawImage(gl.canvas, -540, -SH / 2); octx.restore();
  octx.fillRect(0, 0, out.width, SY - 1); octx.fillRect(0, SY + SH + 1, out.width, out.height - SY - SH);
}
window.ready = false;
Promise.all([fetch('../analysis.json').then(r => r.json()), new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'title.jpg'; })])
  .then(([a, im]) => { init(a, im); window.ready = true; }).catch(e => { window.err = String(e.stack || e); });
window.renderBatch = (t0, n, fps, q, len) => { const r = []; for (let i = 0; i < n; i++) { render(t0 + i / fps, len || 99); r.push(out.toDataURL('image/jpeg', q).slice(23)); } return r; };
</script></body></html>
